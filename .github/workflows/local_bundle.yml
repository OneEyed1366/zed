name: Local bundle

on:
  push:
    branches: [develop]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: script/bundle-mac
            artifact: target/*/release/Zed*.dmg
          - os: windows-latest
            script: script/bundle-windows.ps1
            artifact: target/*/release/*.exe
          - os: ubuntu-latest
            script: script/bundle-linux
            artifact: target/release/zed-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: script/linux

      - name: Bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: ${{ matrix.script }}

      - name: Bundle (Windows)
        if: matrix.os == 'windows-latest'
        run: pwsh ${{ matrix.script }}

      - name: Bundle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: zed-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
